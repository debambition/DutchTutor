{{- if not .Values.secret.existingSecret }}
{{- $name := include "dutchtutor.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- /* Keep a generated AUTH_SECRET stable across upgrades, or every learner gets signed out. */}}
{{- $authSecret := .Values.secret.values.AUTH_SECRET }}
{{- if not $authSecret }}
{{- if and $existing $existing.data (index $existing.data "AUTH_SECRET") }}
{{- $authSecret = index $existing.data "AUTH_SECRET" | b64dec }}
{{- else }}
{{- $authSecret = randAlphaNum 64 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dutchtutor.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := omit .Values.secret.values "AUTH_SECRET" }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  AUTH_SECRET: {{ $authSecret | quote }}
{{- end }}
